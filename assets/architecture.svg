<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="520" fill="#0f172a" rx="18"/>
  <text x="600" y="48" text-anchor="middle" fill="#e2e8f0" font-size="26" font-weight="700">Browser-only architecture (default / deployed build)</text>

  <!-- User -->
  <g transform="translate(60,120)">
    <rect width="180" height="90" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="90" y="40" text-anchor="middle" fill="#e2e8f0" font-size="18" font-weight="600">User</text>
    <text x="90" y="66" text-anchor="middle" fill="#94a3b8" font-size="13">Uploads a PDF</text>
  </g>

  <!-- React app -->
  <g transform="translate(330,100)">
    <rect width="240" height="320" rx="14" fill="#111c33" stroke="#818cf8" stroke-width="2"/>
    <text x="120" y="34" text-anchor="middle" fill="#c7d2fe" font-size="18" font-weight="700">React + Vite UI</text>

    <rect x="20" y="56" width="200" height="54" rx="8" fill="#1e293b"/>
    <text x="120" y="80" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="600">PDFViewer / TextReader</text>
    <text x="120" y="98" text-anchor="middle" fill="#94a3b8" font-size="11">pdfjs-dist renders pages</text>

    <rect x="20" y="122" width="200" height="54" rx="8" fill="#1e293b"/>
    <text x="120" y="146" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="600">pdfService.ts</text>
    <text x="120" y="164" text-anchor="middle" fill="#94a3b8" font-size="11">extracts text, finds Intro page</text>

    <rect x="20" y="188" width="200" height="54" rx="8" fill="#1e293b"/>
    <text x="120" y="212" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="600">AudioPlayer</text>
    <text x="120" y="230" text-anchor="middle" fill="#94a3b8" font-size="11">play / pause / speed / seek</text>

    <rect x="20" y="254" width="200" height="50" rx="8" fill="#1e293b"/>
    <text x="120" y="284" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="600">Web Audio API playback</text>
  </g>

  <!-- Worker -->
  <g transform="translate(660,140)">
    <rect width="250" height="240" rx="14" fill="#15223b" stroke="#f472b6" stroke-width="2"/>
    <text x="125" y="34" text-anchor="middle" fill="#fbcfe8" font-size="18" font-weight="700">Web Worker</text>
    <text x="125" y="56" text-anchor="middle" fill="#94a3b8" font-size="12">tts.worker.ts (off main thread)</text>

    <rect x="24" y="76" width="202" height="60" rx="8" fill="#1e293b"/>
    <text x="125" y="102" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="600">kokoro-js</text>
    <text x="125" y="122" text-anchor="middle" fill="#94a3b8" font-size="11">Kokoro-82M (ONNX)</text>

    <rect x="24" y="150" width="202" height="60" rx="8" fill="#1e293b"/>
    <text x="125" y="176" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="600">WebGPU → WASM</text>
    <text x="125" y="196" text-anchor="middle" fill="#94a3b8" font-size="11">auto device detection</text>
  </g>

  <!-- Model source -->
  <g transform="translate(980,170)">
    <rect width="170" height="180" rx="14" fill="#13251d" stroke="#34d399" stroke-width="2"/>
    <text x="85" y="34" text-anchor="middle" fill="#a7f3d0" font-size="15" font-weight="700">Hugging Face</text>
    <text x="85" y="78" text-anchor="middle" fill="#e2e8f0" font-size="12">onnx-community/</text>
    <text x="85" y="98" text-anchor="middle" fill="#e2e8f0" font-size="12">Kokoro-82M-</text>
    <text x="85" y="118" text-anchor="middle" fill="#e2e8f0" font-size="12">v1.0-ONNX</text>
    <text x="85" y="150" text-anchor="middle" fill="#94a3b8" font-size="11">weights cached</text>
    <text x="85" y="166" text-anchor="middle" fill="#94a3b8" font-size="11">in the browser</text>
  </g>

  <!-- arrows -->
  <g stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
    <path d="M240 165 L330 180"/>
    <path d="M570 230 L660 250"/>
    <path d="M910 255 L980 255"/>
  </g>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <text x="600" y="470" text-anchor="middle" fill="#64748b" font-size="14">No server, no uploads — the PDF and all audio generation stay on the user's device.</text>
  <text x="600" y="496" text-anchor="middle" fill="#475569" font-size="13">An optional Python/FastAPI backend (PyMuPDF + Kokoro + WebSocket) exists for server-side narration.</text>
</svg>
