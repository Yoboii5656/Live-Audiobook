<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="0.55" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#db2777"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.45"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>

  <!-- book icon -->
  <g transform="translate(70,96)">
    <rect x="0" y="0" width="150" height="128" rx="10" fill="#ffffff" opacity="0.14"/>
    <rect x="18" y="20" width="114" height="12" rx="6" fill="#ffffff" opacity="0.85"/>
    <rect x="18" y="46" width="90" height="10" rx="5" fill="#ffffff" opacity="0.6"/>
    <rect x="18" y="68" width="104" height="10" rx="5" fill="#ffffff" opacity="0.6"/>
    <rect x="18" y="90" width="74" height="10" rx="5" fill="#ffffff" opacity="0.6"/>
  </g>

  <!-- audio waveform -->
  <g transform="translate(300,160)" stroke="url(#wave)" stroke-width="10" stroke-linecap="round">
    <line x1="0"   y1="-18" x2="0"   y2="18"/>
    <line x1="26"  y1="-44" x2="26"  y2="44"/>
    <line x1="52"  y1="-70" x2="52"  y2="70"/>
    <line x1="78"  y1="-34" x2="78"  y2="34"/>
    <line x1="104" y1="-58" x2="104" y2="58"/>
    <line x1="130" y1="-22" x2="130" y2="22"/>
    <line x1="156" y1="-48" x2="156" y2="48"/>
    <line x1="182" y1="-30" x2="182" y2="30"/>
  </g>

  <text x="540" y="150" fill="#ffffff" font-size="56" font-weight="700">AI Audiobook Reader</text>
  <text x="542" y="200" fill="#ffffff" font-size="26" opacity="0.92">Turn any PDF into a narrated audiobook — in your browser</text>
  <text x="542" y="244" fill="#ffffff" font-size="20" opacity="0.8">Powered by the open-source Kokoro-82M text-to-speech model</text>
</svg>
